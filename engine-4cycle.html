<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エンジン博士の60秒講座</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf3fb;color:#142e50;font-family:Meiryo,sans-serif}main{max-width:650px;margin:auto;padding:14px}a,button{font:inherit}a{color:#164d80}h1{font-size:clamp(24px,6vw,34px)}.card{background:white;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 4px 16px #16345616}button{border:0;border-radius:12px;background:#164d80;color:white;padding:13px;font-weight:bold;cursor:pointer}button.alt{background:#e0edf8;color:#163456}#menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}#menu button{text-align:left;font-size:14px}#menu button.active{background:#ffd34b;color:#142e50}.screen{background:#d9efff;border-radius:16px;overflow:hidden}svg{display:block;width:100%;height:auto}.talk{display:flex;align-items:center;gap:12px;background:#142e50;color:white;padding:12px;min-height:150px}.talk img{width:90px;height:110px;object-fit:contain;border-radius:12px}.talk p{font-size:clamp(18px,4.8vw,25px);font-weight:bold;margin:6px 0}.talk small{color:#ffda60}#controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#seek{width:100%}#options button,#eo button{display:block;width:100%;text-align:left;margin:8px 0;background:#edf4fa;color:#142e50}#options button.correct,#eo button.correct{background:#d5efdf;color:#165caa}#options button.wrong,#eo button.wrong{background:#fbd9d9;color:#b72c30}#feedback{font-weight:bold;padding:10px}footer{text-align:center;padding:20px}</style><main><a href="index.html">← トップページに戻る</a><h1>エンジン博士の60秒講座</h1><p>レオナビと一緒に、1テーマずつ攻略！</p><div class="card" id="menu"></div><section class="card"><h2 id="title"></h2><div class="screen"><svg viewBox="0 0 400 440" aria-label="エンジン断面の模式図"><rect width="400" height="440" fill="#eaf6ff"/><text x="20" y="25" fill="#226a9d" font-size="15">吸気</text><text x="330" y="25" fill="#a34d27" font-size="15">排気</text><path d="M35 52H145V85" fill="none" stroke="#378fc8" stroke-width="16"/><path d="M365 52H255V85" fill="none" stroke="#ce7850" stroke-width="16"/><rect x="120" y="75" width="160" height="220" rx="8" fill="#9baec0"/><rect x="130" y="85" width="140" height="200" fill="white"/><rect id="gas" x="131" y="86" width="138" height="50" fill="#b7e5ff"/><g id="iv" stroke="#246eaa" stroke-width="7"><path d="M150 60V95M137 95H163"/></g><g id="ev" stroke="#ad5738" stroke-width="7"><path d="M250 60V95M237 95H263"/></g><path d="M200 45V87" stroke="#536579" stroke-width="10"/><g id="spray" stroke="#ed762b" stroke-width="3"><path d="M200 88L180 108M200 88V110M200 88L220 108"/></g><circle cx="200" cy="340" r="47" fill="#c5d5e3" stroke="#68829c" stroke-width="8"/><line id="crank" x1="200" y1="340" stroke="#dc8b36" stroke-width="12" stroke-linecap="round"/><line id="rod" stroke="#617b92" stroke-width="13" stroke-linecap="round"/><g id="piston"><rect x="132" y="-25" width="136" height="40" rx="5" fill="#aabaca" stroke="#536b82" stroke-width="3"/><path d="M136 -17H264" stroke="#536b82" stroke-width="4"/><circle cx="200" cy="0" r="7" fill="#344e69"/></g><text x="10" y="180" font-size="14" fill="#142e50">ピストン</text><text x="12" y="280" font-size="14" fill="#142e50">連接棒</text><text x="200" y="408" text-anchor="middle" font-size="16" fill="#142e50">クランクシャフト</text><text id="stage" x="200" y="433" text-anchor="middle" font-size="18" font-weight="bold" fill="#b64f20"/></svg><div class="talk"><img id="face" src="leonavi.png" alt="レオナビ"><div><small id="speaker">レオナビ</small><p id="caption"></p></div></div></div><div id="controls"><button id="play">▶ 再生</button><button id="pause" class="alt">一時停止</button><button id="sound" class="alt">音声：ON</button></div><input id="seek" type="range" min="0" max="36" step="0.1" value="0" aria-label="再生位置"><p id="time"></p><small>模式図（実際のバルブ開閉時期は簡略化）。音声は端末の日本語読み上げ機能を利用します。</small></section><section class="card"><h2>確認問題</h2><p id="question"></p><div id="options"></div><div id="feedback" aria-live="polite"></div><button id="next">次の講座へ →</button></section><section class="card" id="exam"><h2>国家試験対策・内燃機関 28問</h2><p>参考書40〜48ページの内容に基づくオリジナル5択問題。正解だけでなく理由を覚えよう。</p><button id="restart">全問開始</button> <button id="retry" class="alt">間違いだけ復習</button><p id="progress"></p><h3 id="eq"></h3><div id="eo"></div><p id="ef" aria-live="polite"></p><button id="en">次の問題 →</button></section><footer><a href="index.html">トップページに戻る</a></footer></main><script>
const data=[['エンジンって何？','エンジンって、何をする装置なの？','燃料のエネルギーを動力に変える装置じゃ。燃焼ガスがピストンを押す。','上下運動を回転に変えて、動力を取り出すぞ。','エンジンの役割は？',['燃料のエネルギーを動力に変える','排気を冷やすだけ','電気を必ず蓄える'],0],['ピストンの役割','ピストンってどこにあるの？','シリンダの中を上下する部品じゃ。燃焼ガスの圧力を受けるぞ。','力は連接棒を通じてクランクシャフトに伝わる。','ピストンが受ける力は？',['冷却水の重さ','燃焼ガスの圧力','排気管の重さ'],1],['クランクシャフト','上下の動きがどうして回転になるの？','連接棒とクランクが、ピストンの往復運動を回転運動に変えるんじゃ。','この回転から動力を取り出すぞ。','何を回転に変える？',['ピストンの往復運動','燃料の温度','排気の色'],0],['吸気・排気バルブ','バルブは何のためにあるの？','吸気バルブは空気の入口、排気バルブは燃焼ガスの出口じゃ。','圧縮と膨張では基本的に両方閉じるぞ。','圧縮時のバルブは？',['両方開く','吸気だけ開く','両方閉じる'],2],['① 吸入','最初は何が入るの？','吸気バルブが開き、ピストンが下がって空気を吸い込む。','ディーゼルでは基本的に空気だけを吸入するぞ。','吸入するものは？',['空気','潤滑油','排気ガス'],0],['② 圧縮','空気をぎゅっと押すの？','両方のバルブが閉じ、ピストンが上がって空気を圧縮する。','圧縮された空気は高温になるぞ。','圧縮すると空気の温度は？',['下がる','上がる','必ず一定'],1],['③ 燃焼・膨張','どうやって燃料に火がつくの？','圧縮の終わり付近で燃料を噴射する。高温の空気で自己着火するんじゃ。','燃焼ガスが膨張し、ピストンを押し下げるぞ。','着火の主な仕組みは？',['点火プラグの火花','冷却水','高温の圧縮空気'],2],['④ 排気','燃えたあとのガスはどうなるの？','排気バルブが開き、ピストンが上がってガスを外へ押し出す。','そして次の吸入行程に戻るぞ。','排気時に開くのは？',['吸気バルブ','排気バルブ','両方必ず閉じる'],1],['4サイクルのまとめ','4つの行程を復習しよう！','吸入、圧縮、燃焼・膨張、排気。この順番じゃ。','4行程でクランクシャフトは2回転する。','4行程で何回転？',['1回転','2回転','4回転'],1]];const $=id=>document.getElementById(id);let i=0,t=0,playing=false,last=0,scene=-1,sound=true,raf;const synth=window.speechSynthesis;function stop(){if(synth)synth.cancel()}function say(s){stop();if(!sound||!playing||!synth)return;let u=new SpeechSynthesisUtterance(data[i][s+1]);u.lang='ja-JP';u.rate=1;let voices=synth.getVoices().filter(v=>v.lang.startsWith('ja'));if(voices.length)u.voice=voices[s===0?0:voices.length-1];u.pitch=s===0?1.2:.85;synth.speak(u)}function render(){let s=Math.min(2,Math.floor(t/12));if(s!==scene){scene=s;$('caption').textContent=data[i][s+1];$('speaker').textContent=s===0?'レオナビ':'エンジン博士';$('face').src=s===0?'leonavi.png':'engine-professor.png';$('face').alt=$('speaker').textContent;say(s)}let angle;if(i>=4&&i<=7)angle=(i-4+Math.min(.999,(t%12)/12))*Math.PI;else if(i===3)angle=([0,3,1][s]+Math.min(.999,(t%12)/12))*Math.PI;else angle=t/12*4*Math.PI;let stage=Math.floor(angle/Math.PI)%4,r=40,L=145,x=200+r*Math.sin(angle),y=340-r*Math.cos(angle),p=y-Math.sqrt(L*L-(x-200)**2);$('piston').setAttribute('transform',`translate(0 ${p})`);for(let [id,x1,y1,x2,y2] of [['rod',200,p,x,y],['crank',200,340,x,y]])for(let [k,v] of Object.entries({x1,y1,x2,y2}))$(id).setAttribute(k,v);$('gas').setAttribute('height',Math.max(0,p-25-86));$('gas').setAttribute('fill',['#b7e5ff','#83c3f2','#ffbf70','#c8cdd3'][stage]);$('iv').setAttribute('transform',`translate(0 ${stage===0?12:0})`);$('ev').setAttribute('transform',`translate(0 ${stage===3?12:0})`);$('spray').style.opacity=stage===2&&angle%Math.PI<.8?1:0;$('stage').textContent=['吸入','圧縮','燃焼・膨張','排気'][stage];$('seek').value=t;$('time').textContent=`${Math.floor(t)} / 36 秒`}function tick(ms){if(!playing)return;if(last)t=Math.min(36,t+(ms-last)/1000);last=ms;render();if(t>=36){pause();return}raf=requestAnimationFrame(tick)}function pause(){playing=false;cancelAnimationFrame(raf);stop();$('play').textContent='▶ 再生'}function select(n){pause();i=n;t=0;scene=-1;$('title').textContent=`第${i+1}話　${data[i][0]}`;document.querySelectorAll('#menu button').forEach((b,j)=>b.classList.toggle('active',i===j));$('question').textContent=data[i][4];$('options').replaceChildren();$('feedback').textContent='';data[i][5].forEach((v,j)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{let a=data[i][6];[...$('options').children].forEach((el,k)=>{el.disabled=true;if(k===a)el.classList.add('correct');else if(k===j)el.classList.add('wrong')});$('feedback').textContent=(j===a?'正解！ ':'不正解。正解は「'+data[i][5][a]+'」。')+data[i][3];$('feedback').style.color=j===a?'#165caa':'#b72c30'};$('options').append(b)});$('next').textContent=i===8?'最初の講座へ':'次の講座へ →';render()}data.forEach((d,j)=>{let b=document.createElement('button');b.textContent=`${j+1}. ${d[0]}`;b.onclick=()=>select(j);$('menu').append(b)});$('play').onclick=()=>{if(playing)return;if(t>=36)t=0;playing=true;last=0;scene=-1;render();$(
