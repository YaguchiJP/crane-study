kground:#e0edf8;color:#142e50}.chapter button.active{background:#ffd34b;color:#142e50}#flow{padding:18px;min-height:210px;display:grid;gap:8px;align-content:center}#flow div{background:white;border:2px solid #8db5d6;border-radius:10px;padding:12px;text-align:center;font-weight:bold;transition:background .2s}#flow div.on{background:#ffd34b;border-color:#d49a16}#flow span{text-align:center;color:#24558c}button:disabled{cursor:default;opacity:.85}[hidden]{display:none!important}#lessonVideo video{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:contain;border-radius:12px;background:#000}#lessonVideo{overflow-anchor:none}#mp4{scroll-margin-top:12px}#lessonVideo small{display:block;margin:8px 0;color:#536579}[hidden]{display:none!important}</style><main><a href="index.html">← トップページに戻る</a><h1>エンジン攻略講座</h1><p>エンジン博士とレオナビと一緒に、国家試験に必要な知識を身につけよう！</p><div class="card entry"><a href="#shorts">▶ ショート講座で学ぶ<small>全6章・40講座｜動画・図解・要点解説</small></a><a href="#exam">国家試験対策問題に挑戦 →<small>5択58問・解説・復習機能付き</small></a></div><section class="card" id="shorts"><h2>エンジン博士の学習講座</h2><div id="menu2"></div></section><section class="card" id="player"><h2 id="title"></h2><div id="lessonVideo" hidden><video id="mp4" controls playsinline preload="metadata" src="engine-01.mp4"></video><small style="display:block;text-align:right;font-size:10px;color:#788392;line-height:1.4;margin:3px 0 8px">VOICEVOX:ずんだもん</small><h3>図解で復習</h3><a href="engine-01-poster.png" target="_blank" rel="noopener"><img src="engine-01-poster.png" alt="原動機と動力の伝達：一次原動機と二次原動機" style="display:block;width:100%;height:auto;border-radius:12px"></a><small>画像をタップすると拡大できます。</small></div><div id="legacyPlayer"><div class="screen"><svg viewBox="0 0 400 440" aria-label="エンジン断面の模式図"><rect width="400" height="440" fill="#eaf6ff"/><text x="20" y="25" fill="#226a9d" font-size="15">吸気</text><text x="330" y="25" fill="#a34d27" font-size="15">排気</text><path d="M35 52H145V85" fill="none" stroke="#378fc8" stroke-width="16"/><path d="M365 52H255V85" fill="none" stroke="#ce7850" stroke-width="16"/><rect x="120" y="75" width="160" height="220" rx="8" fill="#9baec0"/><rect x="130" y="85" width="140" height="200" fill="white"/><rect id="gas" x="131" y="86" width="138" height="50" fill="#b7e5ff"/><g id="iv" stroke="#246eaa" stroke-width="7"><path d="M150 60V95M137 95H163"/></g><g id="ev" stroke="#ad5738" stroke-width="7"><path d="M250 60V95M237 95H263"/></g><path d="M200 45V87" stroke="#536579" stroke-width="10"/><g id="spray" stroke="#ed762b" stroke-width="3"><path d="M200 88L180 108M200 88V110M200 88L220 108"/></g><circle cx="200" cy="340" r="47" fill="#c5d5e3" stroke="#68829c" stroke-width="8"/><line id="crank" x1="200" y1="340" stroke="#dc8b36" stroke-width="12" stroke-linecap="round"/><line id="rod" stroke="#617b92" stroke-width="13" stroke-linecap="round"/><g id="piston"><rect x="132" y="-25" width="136" height="40" rx="5" fill="#aabaca" stroke="#536b82" stroke-width="3"/><path d="M136 -17H264" stroke="#536b82" stroke-width="4"/><circle cx="200" cy="0" r="7" fill="#344e69"/></g><text x="10" y="180" font-size="14" fill="#142e50">ピストン</text><text x="12" y="280" font-size="14" fill="#142e50">連接棒</text><text x="200" y="408" text-anchor="middle" font-size="16" fill="#142e50">クランクシャフト</text><text id="stage" x="200" y="433" text-anchor="middle" font-size="18" font-weight="bold" fill="#b64f20"/></svg><div id="flow"></div><div class="talk"><img id="face" src="leonavi.png" alt="レオナビ"><div><small id="speaker"></small><p id="caption"></p></div></div></div><div id="controls"><button id="play">▶ 再生</button><button id="pause" class="alt">一時停止</button><button id="sound" class="alt">音声：ON</button></div><input id="seek" type="range" min="0" max="20" step="0.1" value="0" aria-label="再生位置"><p id="time"></p><small>模式図・流れ図。音声は端末の日本語読み上げ機能を利用します。</small></div><div id="studyNotes" style="background:#edf4fa;border-radius:12px;padding:14px;margin:16px 0;line-height:1.8"><h3 style="margin:0 0 8px">試験に必要な知識</h3><p id="coreNote"></p><p id="extraNote"></p></div><h3>確認問題</h3><p id="question"></p><div id="options"></div><div id="feedback" aria-live="polite"></div><button id="next">次の講座へ →</button></section><section class="card" id="exam"><h2>国家試験対策・内燃機関 58問</h2><p>国家試験に必要な知識を5択問題で身につけよう。正解だけでなく、その理由まで理解しよう。</p><button id="restart">全問開始</button> <button id="retry" class="alt">間違いだけ復習</button><p id="progress"></p><h3 id="eq"></h3><div id="eo"></div><p id="ef" aria-live="polite"></p><button id="en">次の問題 →</button></section><footer><a href="index.html">トップページに戻る</a></footer></main><script>const data=[["原動機とは何か", "エネルギーを機械的な動力に変える装置じゃ。内燃機関は燃料の燃焼を利用するぞ。", "燃料のエネルギー→内燃機関→機械的動力", "原動機の機能", "エネルギーを機械的動力に変換", "機械的動力を必ず電力に変換", "燃料を貯蔵", "冷却水をろ過", "排気を消音"], ["油圧ポンプと油圧モータの違い", "エンジンは一次原動機。油圧ポンプで油圧エネルギーに変え、油圧モータで回転動力に戻すぞ。", "エンジン（一次原動機）→油圧ポンプ→油圧モータ（二次原動機）", "油圧エネルギーを回転動力に変える装置", "油圧モータ", "内燃機関", "燃料タンク", "ラジエータ", "エアクリーナ"], ["ガソリンエンジンとディーゼルエンジンの違い", "ディーゼルは高温の圧縮空気に燃料を噴射して自己着火。ガソリンは電気火花で着火するぞ。", "圧縮空気→燃料噴射→自己着火", "ディーゼルの着火方式", "圧縮着火", "火花点火", "吸気加熱だけで着火", "冷却水による着火", "燃料だけの圧縮"], ["なぜクレーンにはディーゼルエンジンが使われるのか", "ディーゼルエンジンは低回転でも大きなトルクを得やすく、油圧ポンプの駆動に適している。熱効率が高く、燃料消費率が低い傾向にあり、耐久性にも優れる。一方、頑丈な構造が必要で、重量・騒音・振動が大きい傾向がある。", "低回転でも大きなトルク→油圧ポンプの駆動→重作業に適する", "一般的な熱効率の比較", "ディーゼルの方が高い", "ガソリンの方が高い", "常に同じ", "両方100％", "質量だけで決まる"], ["火災・騒音・始動性", "軽油はガソリンより揮発しにくく、引火点が高いため、一般に火災危険度は低い。ただし軽油も引火するため取扱いには注意が必要。ディーゼルは燃焼時の圧力が高く、騒音・振動が大きい傾向がある。圧縮空気の熱で自己着火するため、寒冷時には必要な温度を得にくく、冬季始動性はやや悪い。", "火災危険度：低い→騒音・振動：大→冬季始動：やや悪い", "ディーゼルの一般的特徴", "冬季始動性がやや悪い", "騒音が小さい", "振動が小さい", "火災危険度が比較上高い", "馬力当たり質量が小さい"], ["ピストンとシリンダ", "シリンダはピストンが往復運動する円筒状の部分。ピストンが上昇すると空気が圧縮され高温になる。ディーゼルでは高温の圧縮空気に燃料を噴射して自己着火させ、燃焼ガスの膨張による圧力でピストンを押し下げ、動力を生み出す。", "空気の圧縮→燃料噴射・自己着火→燃焼ガスの膨張→ピストン下降", "ピストンの運動", "シリンダ内の往復運動", "カム軸と同じ回転運動", "吸気管内の回転", "冷却水の循環", "燃料の噴射"], ["連接棒とクランク軸", "コネクチングロッドがピストンの力を伝え、クランク軸で往復運動を回転運動に変えるぞ。", "ピストン→コネクチングロッド→クランク軸", "往復運動を回転運動に変える軸", "クランク軸", "カム軸", "タービン軸", "ポンプ軸", "車軸"], ["吸気・排気バルブ", "吸気バルブは空気の入口、排気バルブは燃焼ガスの出口。圧縮時は基本的に両方閉じるぞ。", "吸気弁→シリンダ→排気弁", "圧
